city: 重庆市
province: 重庆市

# 2026-07-29 改：重庆专属目录，per-city 独立
# 物理页 vs 印刷页：offset = +2（TOC 60 → p62，TOC 118 → p120）

# 市/区识别（中心城区 + 29 区县 + 2 经开区 + 苗木专项）
# 2026-07-29 增：自治县同时配短名（PDF cap 用"石柱县"，yaml 配"石柱土家族自治县"）
# 2026-07-31 改：删 8 区（渝中/江北/南岸/沙坪坝/九龙坡/大渡口/渝北/巴南 + 北碚）
#   原因：重庆 06 PDF 把这 9 区合并到"中心城区" 1 章，xlsx 不单列（用户原话"只写中心城区就行了"）
districts:
  - 中心城区
  - 万州区
  - 涪陵区
  - 黔江区
  - 长寿区
  - 江津区
  - 合川区
  - 永川区
  - 南川区
  - 綦江区
  - 大足区
  - 璧山区
  - 铜梁区
  - 潼南区
  - 荣昌区
  - 开州区
  - 梁平区
  - 武隆区
  - 城口县
  - 丰都县
  - 垫江县
  - 忠县
  - 云阳县
  - 奉节县
  - 巫山县
  - 巫溪县
  - 石柱土家族自治县
  - 石柱县                # 短名（PDF cap 用）
  - 秀山土家族苗族自治县
  - 秀山县                # 短名
  - 酉阳土家族苗族自治县
  - 酉阳县                # 短名
  - 彭水苗族土家族自治县
  - 彭水县                # 短名
  - 万盛经开区
  - 双桥经开区
  - 两江新区
  - 高新区

# 重庆 06 PDF 物理页与印刷页关系
# 印刷页 TOC "60 综合价格信息" → 实际 PDF p62
# 印刷页 TOC "118 行业推荐价格信息" → 实际 PDF p120
# 物理页 = 印刷页 + 2
page_offset: 2

# 2026-07-29 增：目录格式（2026-07-29 加）
# 重庆期刊式 TOC："60 综合价格信息"（页码 章节名）
# 成都 TOC："综合价格信息 …… (60)"（章节名 页码，trailing）
# 未来重庆 07/08 不改 yaml 自动适配（重庆一直是 leading）
toc_format: leading

# colspan/rowspan 展开（重庆需要展开 colspan 才能拿到完整列数）
expand_colspan: true

# 章节范围（按 PDF 物理页，单位 page_idx 0-indexed）
sections:
  market:
    page_range: [62, 117]   # 综合价格信息（中心城区 + 区县 + 苗木）
    toc_label: 综合价格信息
  new_material:
    page_range: [119, 127]  # 行业推荐价格信息（双桥经开区 + 5 协会）
    toc_label: 行业推荐价格信息

# 2026-07-29 增：重庆专属 SKIP 规则（per-city 独立）
# MARKET 区间 (p62-117) 混了 5 类非数据表：
#   1. 政府 KPI（"城镇危旧房改造数量"）
#   2. 区县建设概况（"改造总面积/外墙改造面积"）
#   3. 装饰/拆除工程定额（"立面块料拆除/铲除涂料面"）
#   4. 工料机综合表（"综合工日/载重汽车台班"）
#   5. 苗木/花卉等专项段
skip_rules:
  by_caption:
    - "城镇危旧房改造"      # 政府KPI
    - "建设性质"           # 区县工程概况
    - "编制单位"           # 区县编制说明
    - "本体拆除工程"        # 13 列本体工程
    - "造价比例"           # 16 列造价比例
    - "定额子目"           # 定额造价表
    - "老旧小区"           # 老旧小区改造段
    - "改造工程概况"        # 区县改造工程概况
  by_ncols: [2, 3, 13, 16]   # 列数命中 → SKIP 兜底
  # header-level signals：表头含任一关键词 → 整表 SKIP
  # 2026-07-29 改：删 "指标"（NM 段协会表"指标等级/技术指标"是合法 column；2026-07-29 误杀 p123/p127）
  by_header_signal:
    - "2025年"             # KPI 指标对比表（"序号|指标|2025年|2030年"）
  # row-level signals：前 5 行含任一关键词 → 整表 SKIP
  by_row_signal:
    - "城镇危旧房改造数量"   # KPI 表
    - "老旧街区厂区改造提升数量"
    - "城中村改造数量"
    - "历史建筑修缮数量"
    - "改造总面积"         # 建设概况表特征
    - "外墙改造面积"
    - "屋面改造面积"
    - "门窗改造面积"
    - "综合工日"           # 工料机综合表特征
    - "载重汽车"           # 台班
    - "立面块料拆除"       # 装饰/拆除定额特征
    - "铲除涂料面"
    - "广告位、广告牌拆除"   # 拆除定额特征
    - "金属防盗网拆除"
    # 定额子目/造价指标表特征（DB 编号）
    - "DB0"                 # DB0251/DB0286/DB0465 等定额编号
    - "定额子目"
    - "项目名称"
    - "工作内容"
    - "计量单位"
    - "综合单价"
    - "工程量计算规则"

# 2026-07-29 增：Sheet 输出配置（per-city 独立，step6 读）
sheet_config:
  sheets:
    - name: 市场信息价
      section: MARKET
    - name: 行业推荐
      section: NEW_MATERIAL
    - name: 元数据
      section: null

# 表结构配置（驱动 step3_extract_cq.py 字段提取）
table_schemas:

  # ===== Sheet 1 市场信息价（区县 6 列带备注）=====

  # 区县材料价 6 列：序号 | 材料名称 | 规格及型号 | 单位 | 不含税价(元) | 备注
  # 2026-07-29 重庆 06 实测：区县表 6 列 + 备注列（colspan 合并情况）
  market_6col_district:
    n_cols: 6
    section: MARKET
    field_map:
      序号: 0
      材料名称: 1
      规格及型号: 2
      单位: 3
      不含税价(元): 4
      备注: 5

  # 苗木 8 列（带 colspan=4 嵌套表头）— 2026-07-29 改：实际列序为
  #   0=品名 1=株高 2=胸径 3=冠幅 4=分枝高 5=单位 6=不含税价 7=备注
  # 2026-07-29 改：用户要求保留 4 列独立规格（不合并成单一 规格及型号 列）
  # 2026-07-30 P2-5 增：加「地径」字段；花灌木 3-spec 行的 col 2 写到「地径」
  # 乔木/棕榈 4-spec 行的 col 2 写到「胸径」，「地径」列空（与 sheet 输出列序对齐）
  market_8col_seedling:
    n_cols: 8
    page_range: [91, 91]    # 2026-07-29 改：苗木集中在一页
    section: MARKET
    field_map:
      # 苗木表无序号列，"品名" 直接就是材料名
      材料名称: 0           # 品名 = 小叶榕/银杏...
      株高: 1               # 4 列规格独立输出（不合并）
      胸径: 2               # 乔木/棕榈：col 2 = 胸径；花灌木：由 step3 P2-5 重写到「地径」
      地径: 2               # 2026-07-30 P2-5：花灌木 col 2 单独列（用户原话：表头不一样肯定要单独列）
      冠幅: 3
      分枝高: 4
      单位: 5               # 单位
      不含税价(元): 6
      备注: 7

  # 苗木 5 列（草本/地被）：0=品名 1=规格 2=单位 3=不含税价 4=备注
  # 2026-07-29 增：PDF 苗木段 32 行是 5 列（葱兰/麦冬草/结缕草/肾蕨/玉龙草...）
  # 8 列硬切会错位 3 位（"kg" 跑到胸径、"3.60" 跑到冠幅）
  # step3_extract_cq.extract_market_rows 按行 cell 数 dispatch，5 列走此 schema
  market_5col_seedling:
    n_cols: 5
    page_range: [91, 91]
    section: MARKET
    field_map:
      材料名称: 0
      # 草本无 4 规格分维度 → 株高/胸径/冠幅/分枝高 全 None（输出 xlsx 也留 4 列为空）
      规格及型号: 1         # 草本单一规格（如"120-200"）
      单位: 2
      不含税价(元): 3
      备注: 4

  # 区县材料价 5 列（无备注列）：序号 | 材料名称 | 规格 | 单位 | 不含税价
  # 2026-07-29 v5 增：区县表 5 列 (cap=区名, 13 行, 没备注) 被误匹到草本 schema 串列
  # 草本 5 列 = 品名|规格|单位|价格|备注
  # 区县 5 列 = 序号|材料名|规格|单位|价格
  # 必须 inline dispatch: row[0] 是数字 → 区县; row[0] 是中文 → 草本
  market_5col_district:
    n_cols: 5
    section: MARKET
    field_map:
      序号: 0
      材料名称: 1
      规格及型号: 2
      单位: 3
      不含税价(元): 4
      # 备注: 无（区县 5 列表没这列）

  # 2026-08-11 增：26.1 区县 8 列 (2 区域 4 价格) — 26.1 荣昌区独有
  #   序号 | 材料名称 | 规格及型号 | 单位 | 含税价(元) | 不含税价(元) | 含税价(元) | 不含税价(元)
  # 跟 26.6 6 列 (无含税区 2) 不同; 跟 8col 苗木 (无含税) 不同
  # 区分: header 含 "含税"+"不含税" + 无 "株高"+"胸径" → 8col_district
  market_8col_district:
    n_cols: 8
    section: MARKET
    field_map:
      序号: 0
      材料名称: 1
      规格及型号: 2
      单位: 3
      含税价(元): 4
      不含税价(元): 5
      # col 6/7 区域 2 价格丢弃 (用户只关心主区域)

  # ===== Sheet 2 行业推荐（协会 6 列带备注 + 填报人/联系方式）=====

  # 协会推荐 6 列（统一 schema，所有协会表都用这个）：
  #   序号 | 材料名称 | 规格型号 | 单位 | 不含税价(元) | 备注
  # 2026-07-29 v5b 改: 不再为 5/7 列各写专属 schema。step3_extract_cq 内联按 n_cols_actual 处理：
  #   - 5 列 (p123 混凝土协会): col 3 (建议加价) → 不含税价; col 4 (备注) → 备注; 单位空
  #   - 6 列 (p120/121/124): 标准映射
  #   - 7 列 (p127 地质矿业嵌套表): col 2 (指标名称) → 规格; col 3 (指标要求) → 备注; 每行独立
  recommend_6col_assoc:
    n_cols: 6
    section: NEW_MATERIAL
    field_map:
      序号: 0
      材料名称: 1
      规格型号: 2
      单位: 3
      不含税价(元): 4
      备注: 5