services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FILE_ASSET_POSTGRES_DB:-file_asset}
      POSTGRES_USER: ${FILE_ASSET_POSTGRES_USER:-file_asset}
      POSTGRES_PASSWORD: ${FILE_ASSET_POSTGRES_PASSWORD:?set FILE_ASSET_POSTGRES_PASSWORD}
    ports:
      - "${FILE_ASSET_POSTGRES_BIND:-0.0.0.0:15432}:5432"
    volumes:
      - file_asset_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${FILE_ASSET_MINIO_ROOT_USER:?set FILE_ASSET_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${FILE_ASSET_MINIO_ROOT_PASSWORD:?set FILE_ASSET_MINIO_ROOT_PASSWORD}
    ports:
      - "${FILE_ASSET_MINIO_API_BIND:-0.0.0.0:9000}:9000"
      - "${FILE_ASSET_MINIO_CONSOLE_BIND:-0.0.0.0:19001}:9001"
    volumes:
      - file_asset_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  file_asset_postgres:
  file_asset_minio:
