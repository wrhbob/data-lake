services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: file_asset
      POSTGRES_USER: file_asset
      POSTGRES_PASSWORD: file_asset
    ports:
      - "15432:5432"
    volumes:
      - file_asset_postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "19001:9001"
    volumes:
      - file_asset_minio:/data

volumes:
  file_asset_postgres:
  file_asset_minio:
