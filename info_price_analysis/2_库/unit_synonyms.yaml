# 单位换算规则（重要！）
# 例：千匹 → 块 * 1000（包装单位）
# 例：T → t（同义不换算）
# 例：m³ → m³（同义不换算但写法不同）
# 例：kg/根 → 包装单位，匹配时不换算
#
# 格式: 标准单位: [变体1, 变体2, ...]
# 同义不换算（只换写法）

m³:
  - 立方米
  - m3
  - 立米
  - cum

m:
  - 米
  - m

t:
  - 吨
  - T

kg:
  - 千克
  - KG

m²:
  - 平方米
  - m2
  - sqm

km:
  - 千米
  - KM

个:
  - 颗
  - 只

套:
  - 付
  - 组

株:
  - 棵

千匹:
  - 千块
